name: Release v4.1 (one-time dispatch bridge)

on:
  push:
    branches:
      - release/v4.1

permissions:
  contents: write
  actions: write

jobs:
  release:
    uses: cainiao524/foundation-sunshine-appdisplay/.github/workflows/main.yml@release/v4.1
    with:
      build-version: v4.1
      publish-release: true
      release-tag: v4.1
      release-name: Sunshine App Display Profile v4.1
      source-ref: release/v4.1
      prerelease: false
    secrets: inherit
