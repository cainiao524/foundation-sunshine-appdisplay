name: Build and Release

# Pull requests and pushes only build Actions artifacts. A formal release can
# only be requested through workflow_dispatch after all validation succeeds.
on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - master
  workflow_call:
    inputs:
      build-version:
        description: '用于产物文件名的版本标识'
        required: true
        type: string
      publish-release:
        description: '构建成功后创建新的正式发布页'
        required: false
        default: false
        type: boolean
      release-tag:
        description: '新发布使用的标签'
        required: true
        type: string
      release-name:
        description: '新发布页面显示的名称'
        required: true
        type: string
      source-ref:
        description: '需要检出、测试和打包的精确提交或引用'
        required: true
        type: string
      prerelease:
        description: '标记为预发布（true）或正式发布（false）'
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      build-version:
        description: '用于产物文件名的版本标识；留空时使用手动构建时间'
        required: false
        type: string
      publish-release:
        description: '构建成功后创建新的正式发布页'
        required: false
        default: false
        type: boolean
      release-tag:
        description: '新发布使用的标签；禁止与现有标签重复'
        required: false
        type: string
      release-name:
        description: '新发布页面显示的名称'
        required: false
        type: string
      source-ref:
        description: '需要检出、测试和打包的精确提交或引用；留空时使用当前提交'
        required: false
        type: string
      prerelease:
        description: '标记为预发布（true）或正式发布（false）'
        required: false
        default: false
        type: boolean
      gui_run_id:
        description: 'Optional successful Panel artifact run; its commit must match the Panel submodule'
        type: string
        default: ''
      rtx_hdr:
        description: 'RTX HDR support for development branches (official master always requires ON)'
        type: choice
        default: AUTO
        options:
          - 'AUTO'
          - 'ON'
          - 'OFF'

permissions:
  contents: read

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

# The pinned LizardByte release action still composes a Node.js 20 action.
# Run it on Node.js 24 ahead of GitHub's fall 2026 Node.js 20 removal.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  setup_release:
    name: Setup Release
    outputs:
      publish_release: ${{ steps.setup_build_auto.outputs.publish_release || steps.setup_release_manual.outputs.publish_release }}
      release_commit: ${{ steps.setup_build_auto.outputs.release_commit || steps.setup_release_manual.outputs.release_commit }}
      release_name: ${{ steps.setup_build_auto.outputs.release_name || steps.setup_release_manual.outputs.release_name }}
      release_tag: ${{ steps.setup_build_auto.outputs.release_tag || steps.setup_release_manual.outputs.release_tag }}
      release_prerelease: ${{ steps.setup_build_auto.outputs.release_prerelease || steps.setup_release_manual.outputs.release_prerelease }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Actions artifact build
        id: setup_build_auto
        if: github.event_name != 'workflow_dispatch' && github.event_name != 'workflow_call'
        shell: bash
        run: |
          VERSION="ci-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:8}"
          echo "publish_release=false" >> "$GITHUB_OUTPUT"
          echo "release_commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "release_name=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_prerelease=false" >> "$GITHUB_OUTPUT"

      - name: Setup Release (Manual)
        id: setup_release_manual
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_RELEASE: ${{ inputs['publish-release'] }}
          REQUESTED_NAME: ${{ inputs['release-name'] }}
          REQUESTED_TAG: ${{ inputs['release-tag'] }}
          REQUESTED_VERSION: ${{ inputs['build-version'] }}
          REQUESTED_SOURCE_REF: ${{ inputs['source-ref'] }}
          REQUESTED_PRERELEASE: ${{ inputs['prerelease'] }}
        run: |
          SUFFIX=$([ "${{ github.ref_name }}" = "master" ] && echo "" || echo "-dev")
          if [ -n "$REQUESTED_VERSION" ]; then
            VERSION="$REQUESTED_VERSION"
          else
            VERSION="manual-$(date +%Y%m%d-%H%M%S)${SUFFIX}"
          fi
          TAG="${REQUESTED_TAG:-$VERSION}"
          NAME="${REQUESTED_NAME:-$TAG}"
          SOURCE_REF="${REQUESTED_SOURCE_REF:-${{ github.sha }}}"
          git fetch --no-tags --no-recurse-submodules origin "$SOURCE_REF"
          SOURCE_REF=$(git rev-parse 'FETCH_HEAD^{commit}')
          if [ "$PUBLISH_RELEASE" = "true" ]; then
            if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
              echo '::error::正式发布只能由用户手动触发 main.yml。'
              exit 1
            fi
            if [ -z "$REQUESTED_TAG" ]; then
              echo '::error::正式发布必须显式填写 release-tag。'
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "::error::标签 ${TAG} 已存在，禁止覆盖。"
              exit 1
            fi
            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" >/dev/null 2>&1; then
              echo "::error::发布 ${TAG} 已存在，禁止覆盖。"
              exit 1
            fi
          fi
          echo "publish_release=${PUBLISH_RELEASE}" >> $GITHUB_OUTPUT
          echo "release_commit=${SOURCE_REF}" >> $GITHUB_OUTPUT
          echo "release_name=$NAME" >> $GITHUB_OUTPUT
          echo "release_tag=$TAG" >> $GITHUB_OUTPUT
          echo "release_prerelease=${REQUESTED_PRERELEASE:-false}" >> $GITHUB_OUTPUT

  vdd_smoke:
    name: VDD helper smoke tests
    needs: setup_release
    permissions:
      contents: read
      actions: write  # prune stale ccache entries after saving this run's
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup_release.outputs.release_commit }}

      - name: Run VDD helper smoke tests
        shell: pwsh
        run: |
          # The helper suite deliberately probes nonzero native exit codes.
          # Its assertions throw on failure; keep those codes available to it.
          $PSNativeCommandUseErrorActionPreference = $false
          & .\src_assets\windows\misc\vdd\smoke-test-vdd-device-helper.ps1
          & .\src_assets\windows\misc\vdd\smoke-test-install-vdd-selection.ps1
          exit 0

  build_win:
    name: Windows
    needs: [setup_release, vdd_smoke]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup_release.outputs.release_commit }}
          submodules: recursive
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.longpaths
          GIT_CONFIG_VALUE_0: 'true'

      - name: Setup Dependencies Windows
        uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          # Required, not redundant with the `pacman -Syu` below. When
          # msys2-runtime itself needs upgrading, pacman closes every MSYS2
          # process to finish the job, which kills the workflow shell and fails
          # the step with exit 1. setup-msys2 performs that upgrade with the
          # restart it needs; by the time our own step runs, the runtime is
          # already current and only the dependency list is left to install.
          update: true
          install: >-
            wget
            curl

      - name: Update Windows dependencies
        env:
          opus_version: '1.6.1-1'
        shell: msys2 {0}
        run: |
          # download pinned opus version
          opus_tarball="mingw-w64-ucrt-x86_64-opus-${opus_version}-any.pkg.tar.zst"
          wget https://repo.msys2.org/mingw/ucrt64/${opus_tarball}

          # install dependencies
          # NOTE: gcc/gcc-libs were previously pinned to 15.1.0-5 to work around
          # a broken upstream gcc 15.x. Since msys2 has moved on to gcc 16.x and
          # other packages (cmake, etc.) now require gcc-libs 16.x ABI, pinning
          # an old gcc-libs causes cmake.exe to silently fail to load (exit 127).
          # Let pacman install the full toolchain at the current upstream version.
          dependencies=(
            "git"
            "mingw-w64-ucrt-x86_64-ccache"
            "mingw-w64-ucrt-x86_64-cmake"
            "mingw-w64-ucrt-x86_64-lld"
            "mingw-w64-ucrt-x86_64-ninja"
            "mingw-w64-ucrt-x86_64-cppwinrt"
            "mingw-w64-ucrt-x86_64-curl-winssl"
            "mingw-w64-ucrt-x86_64-graphviz"
            "mingw-w64-ucrt-x86_64-MinHook"
            "mingw-w64-ucrt-x86_64-miniupnpc"
            "mingw-w64-ucrt-x86_64-nlohmann-json"
            # "mingw-w64-ucrt-x86_64-nodejs"  # Replaced by actions/setup-node (vite 8 requires MSVC Node.js)
            # "mingw-w64-ucrt-x86_64-nsis"  # Replaced by Inno Setup
            "mingw-w64-ucrt-x86_64-onevpl"
            "mingw-w64-ucrt-x86_64-openssl"
            "mingw-w64-ucrt-x86_64-toolchain"
            "mingw-w64-ucrt-x86_64-autotools"
          )

          pacman -Syu --noconfirm "${dependencies[@]}"

          # install pinned opus after Syu to prevent upgrade
          pacman --noconfirm -U ${opus_tarball}

      - name: Verify Build Tools
        shell: msys2 {0}
        run: |
          echo "Verifying build tools are installed..."
          which cmake || (echo "cmake not found" && exit 1)
          which ninja || (echo "ninja not found" && exit 1)
          which gcc || (echo "gcc not found" && exit 1)
          
          echo "All build tools verified successfully"
          echo "  CMake: $(cmake --version | head -1)"
          echo "  Ninja: $(ninja --version)"
          echo "  GCC: $(gcc --version | head -1)"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust for pinned Control Panel
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build and test pinned Control Panel
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Push-Location .\src_assets\common\sunshine-control-panel
          try {
            npm ci
            npm run build:renderer
            npm run test:renderer
            cargo test --release --manifest-path .\src-tauri\Cargo.toml --target x86_64-pc-windows-msvc
            cargo build --release --manifest-path .\src-tauri\Cargo.toml --target x86_64-pc-windows-msvc
            if (-not (Test-Path -LiteralPath .\src-tauri\target\x86_64-pc-windows-msvc\release\sunshine-gui.exe -PathType Leaf)) {
              throw 'Pinned Control Panel build did not produce sunshine-gui.exe.'
            }
            # The upstream GUI tray build requires the native stylus plugin
            # next to sunshine-gui.exe. Build it into the same target/release
            # directory so cmake's SUNSHINE_PREFER_LOCAL_GUI probe finds both.
            # cargo names the cdylib after [lib] name (underscores); the GUI
            # and cmake expect the hyphenated asset name, so rename it.
            cargo build --release --manifest-path .\native-plugins\stylus\Cargo.toml `
              --target x86_64-pc-windows-msvc `
              --target-dir .\src-tauri\target
            $stylusDll = '.\src-tauri\target\x86_64-pc-windows-msvc\release\alkaidlab-plugin-stylus.dll'
            if (-not (Test-Path -LiteralPath $stylusDll -PathType Leaf)) {
              $underscoreDll = '.\src-tauri\target\x86_64-pc-windows-msvc\release\alkaidlab_plugin_stylus.dll'
              if (-not (Test-Path -LiteralPath $underscoreDll -PathType Leaf)) {
                throw 'Pinned Control Panel stylus plugin build did not produce alkaidlab-plugin-stylus.dll.'
              }
              Move-Item -LiteralPath $underscoreDll -Destination $stylusDll
            }
            if (-not (Test-Path -LiteralPath $stylusDll -PathType Leaf)) {
              throw 'Pinned Control Panel stylus plugin dll is missing after rename.'
            }
          }
          finally {
            Pop-Location
          }

      - name: Test and prepare pinned DualSense manifest
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          .\scripts\test-prepare-ds5-sidecar-manifest.ps1
          .\scripts\prepare-ds5-sidecar-manifest.ps1 -OutputPath .\build\ds5-sidecar-package.json

      - name: Build Web UI
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci
          npm run lint:webui
          npm run test:webui
          npm run i18n:validate
          npm run i18n:format:check
          New-Item -ItemType Directory -Force -Path build | Out-Null
          $env:SUNSHINE_SOURCE_ASSETS_DIR = "${{ github.workspace }}\src_assets"
          $env:SUNSHINE_ASSETS_DIR = "${{ github.workspace }}\build"
          npm run build

      - name: Cache compiler objects
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}\.ccache
          # The key is unique per run; the prefix restore-key is what actually
          # produces the hits: every run seeds itself from the most recent
          # previous one. Saving is split out below so that only master
          # writes: PR-branch entries are invisible to other branches yet
          # still consume the shared cache quota, and when that quota fills
          # (10 GB, LRU), eviction wiped the whole lineage once and forced a
          # full 47-minute cold rebuild.
          key: ccache-windows-${{ github.run_id }}
          restore-keys: |
            ccache-windows-

      - name: Fetch paired GUI artifact
        if: github.event_name == 'workflow_dispatch' && inputs.gui_run_id != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GUI_RUN_ID: ${{ inputs.gui_run_id }}
        run: |
          $arguments = @{ Destination = "$env:RUNNER_TEMP/paired-gui" }
          if ($env:GUI_RUN_ID) { $arguments.RunId = $env:GUI_RUN_ID }
          ./scripts/fetch-paired-gui.ps1 @arguments
          "GUI_BUNDLE_DIR=$env:RUNNER_TEMP/paired-gui" >> $env:GITHUB_ENV

      - name: Configure Windows
        id: configure_windows
        shell: msys2 {0}
        env:
          # Only trusted events may expose the read-only token to PR-controlled CMake code.
          GITHUB_TOKEN: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.token || '' }}
          # Same-repository PRs are trusted; fork PRs never receive the private credential.
          RTX_VIDEO_SDK_URL: ${{ (github.repository == 'AlkaidLab/foundation-sunshine' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'AlkaidLab/foundation-sunshine')) && secrets.RTX_VIDEO_SDK_URL || '' }}
          RTX_VIDEO_SDK_TOKEN: ${{ (github.repository == 'AlkaidLab/foundation-sunshine' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'AlkaidLab/foundation-sunshine')) && secrets.DRIVER_DOWNLOAD_TOKEN || '' }}
          RTX_VIDEO_NGX_APPLICATION_ID: ${{ (github.repository == 'AlkaidLab/foundation-sunshine' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'AlkaidLab/foundation-sunshine')) && secrets.RTX_VIDEO_NGX_APPLICATION_ID || '' }}
          SUNSHINE_RTX_HDR: ${{ !(github.repository == 'AlkaidLab/foundation-sunshine' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'AlkaidLab/foundation-sunshine')) && 'OFF' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/master') && 'ON' || inputs.rtx_hdr || 'AUTO' }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          BUILD_VERSION: ${{ needs.setup_release.outputs.release_tag }}.杂鱼
          COMMIT: ${{ needs.setup_release.outputs.release_commit }}
          # ccache.exe is a native binary, so it reads the Windows-style path
          # straight out of the environment even under the msys2 shell.
          CCACHE_DIR: ${{ github.workspace }}\.ccache
          CCACHE_MAXSIZE: 2G
          # `pacman -Syu` can move the toolchain underneath us between runs.
          # Hashing the compiler binary instead of its mtime keeps the cache
          # valid across runs that did not actually change gcc.
          CCACHE_COMPILERCHECK: content
          # Fork PRs still try every public dependency. Keep the build usable
          # when a release asset is temporarily unavailable; official builds
          # continue to require the complete driver set.
          DRIVER_DEPS_REQUIRED: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'OFF' || 'ON' }}
        run: |
          mkdir -p build
          ccache --zero-stats
          gui_options=()
          if [[ -n "${GUI_BUNDLE_DIR:-}" ]]; then
            gui_options=(-DFETCH_GUI=OFF "-DGUI_DIR=$GUI_BUNDLE_DIR")
          fi
          cmake \
            -B build \
            -G Ninja \
            -S . \
            "${gui_options[@]}" \
            -DBUILD_DOCS=OFF \
            -DSUNSHINE_RTX_HDR="$SUNSHINE_RTX_HDR" \
            -DBUILD_TESTS=ON \
            -DBUILD_TRAY_TESTS=ON \
            -DBUILD_WEB_UI=OFF \
            -DFETCH_GUI=OFF \
            -DSUNSHINE_PREFER_LOCAL_GUI=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSUNSHINE_ASSETS_DIR=assets \
            -DDRIVER_DEPS_REQUIRED=${DRIVER_DEPS_REQUIRED} \
            -DSUNSHINE_PUBLISHER_NAME='${{ github.repository_owner }}' \
            -DSUNSHINE_PUBLISHER_WEBSITE='https://github.com/${{ github.repository }}' \
            -DSUNSHINE_PUBLISHER_ISSUE_URL='https://github.com/${{ github.repository }}/issues'
          if grep -q '^SUNSHINE_RTX_HDR_AVAILABLE:INTERNAL=TRUE' build/CMakeCache.txt; then
            echo 'rtx_hdr=true' >> "$GITHUB_OUTPUT"
          else
            echo 'rtx_hdr=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Build Windows
        shell: msys2 {0}
        env:
          CCACHE_DIR: ${{ github.workspace }}\.ccache
          CCACHE_MAXSIZE: 2G
          CCACHE_COMPILERCHECK: content
        run: |
          ninja -C build
          ccache --show-stats

      - name: Save compiler objects
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}\.ccache
          key: ccache-windows-${{ github.run_id }}

      - name: Run native tests
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Save compiler cache
        # Only master writes (always(): a failed or cancelled build still
        # produced valid objects). PR runs restore master's entry, so they
        # don't need to save, and skipping their saves keeps the shared
        # cache quota flat.
        if: always() && github.ref == 'refs/heads/master'
        id: ccache_save
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}\.ccache
          key: ccache-windows-${{ github.run_id }}

      - name: Prune stale compiler cache entries
        # Collapse the cache to exactly one entry (the newest one saved).
        # Entries pile up one-per-run otherwise; on a 10 GB repo quota that
        # once got the entire lineage LRU-evicted. A single entry is also
        # restored by every later run, which keeps resetting its 7-day
        # inactivity clock, so neither eviction path can take it out.
        # Only entries from runs OLDER than this one are deleted (run ids
        # increase monotonically): a cancelled run still executes its
        # always() save and prune alongside the next run, and age-filtered
        # prunes converge to the newest entry under any interleaving —
        # pruning by "not my key" instead could race down to zero entries.
        # Skipped unless the save step actually succeeded (outcome keeps the
        # real result under continue-on-error; the save subaction sets no
        # outputs, so conclusion can't tell success from failure).
        if: always() && github.ref == 'refs/heads/master' && steps.ccache_save.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $current = "ccache-windows-${{ github.run_id }}"
          # Page through the caches API instead of `gh cache list`: the
          # latter caps at --limit 100, and once this repo's other caches
          # (msys2, npm, ...) grow past that, stale ccache entries would
          # fall outside the window and never get pruned.
          $stale = gh api --paginate "repos/$env:GITHUB_REPOSITORY/actions/caches?per_page=100" --jq '.actions_caches[] | select(.key | test("^ccache-windows-[0-9]+$")) | [(.key | sub("^ccache-windows-";"") | tonumber), .id, .key] | @tsv' |
            Where-Object { $_ } |
            ForEach-Object {
              $parts = $_ -split "`t"
              if ([long]$parts[0] -lt [long]"${{ github.run_id }}") {
                [pscustomobject]@{ Id = $parts[1]; Key = $parts[2] }
              }
            }
          foreach ($entry in $stale) {
            gh cache delete $entry.Id --repo $env:GITHUB_REPOSITORY
            Write-Output "Pruned $($entry.Key)"
          }
          Write-Output "Pruned $(@($stale).Count) stale ccache entries; kept $current"

      - name: Cache Inno Setup
        id: inno-cache
        uses: actions/cache@v6
        with:
          path: C:\Program Files (x86)\Inno Setup 6
          key: inno-setup-6.7.3

      - name: Install Inno Setup
        if: steps.inno-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          # TEMP (v3.0.1 only): pinned GitHub Release download with digest
          # check. jrsoftware.org has repeatedly timed out from this repo's
          # runners; revisit following upstream (scheme B) afterwards.
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
          $expectedSha256 = '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732'
          $installer = "$env:TEMP\innosetup.exe"
          $installed = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              Remove-Item -LiteralPath $installer -Force -ErrorAction SilentlyContinue
              Invoke-WebRequest -Uri $url -OutFile $installer -MaximumRetryCount 3 -RetryIntervalSec 5
              $actualSha256 = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actualSha256 -ne $expectedSha256) {
                throw "Inno Setup SHA-256 mismatch: $actualSha256"
              }
              $bytes = [System.IO.File]::ReadAllBytes($installer)
              if ($bytes.Length -lt 1MB -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
                throw 'Downloaded Inno Setup installer is not a valid Windows executable.'
              }
              $process = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-' -Wait -PassThru
              if ($process.ExitCode -ne 0) {
                throw "Inno Setup installer exited with code $($process.ExitCode)."
              }
              $installed = $true
              break
            }
            catch {
              Write-Warning "Inno Setup install attempt $attempt failed: $_"
              if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
            }
          }
          if (-not $installed) {
            throw 'Inno Setup installation failed after three attempts.'
          }

      - name: Add Inno Setup to PATH
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Package Windows
        shell: msys2 {0}
        env:
          RTX_VIDEO_ADAPTER_BUILT: ${{ steps.configure_windows.outputs.rtx_hdr }}
          RTX_VIDEO_ADAPTER_REQUIRED: ${{ github.repository == 'AlkaidLab/foundation-sunshine' && github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
        run: |
          set -o pipefail
          mkdir -p artifacts
          cd build

          if [[ "$RTX_VIDEO_ADAPTER_REQUIRED" == "true" && "$RTX_VIDEO_ADAPTER_BUILT" != "true" ]]; then
            echo "Protected master build did not produce the required NVIDIA RTX Video adapter"
            exit 1
          fi

          # Keep installer and portable outputs isolated. The installer must
          # always come from the Foundation Inno Setup definition, never CPack.
          rm -rf inno_staging inno_artifacts portable_artifacts cpack_artifacts
          mkdir -p inno_artifacts portable_artifacts
          cmake --install . --prefix ./inno_staging
          test -f ./inno_staging/tools/ds5-sidecar-package.json
          test ! -e ./inno_staging/tools/sunshine-ds5-sidecar/Sunshine.Ds5Sidecar.exe
          if [[ "$RTX_VIDEO_ADAPTER_BUILT" == "true" ]]; then
            test -f ./inno_staging/tools/hdr_enhanced/nvidia_rtx_video/foundation_rtx_video_adapter.dll
            test ! -e ./inno_staging/msvcp140.dll
            test ! -e ./inno_staging/vcruntime140.dll
          fi
          test ! -e ./inno_staging/tools/hdr_enhanced/nvidia_rtx_video/nvngx_truehdr.dll
          test ! -e ./inno_staging/tools/hdr_enhanced/nvidia_dlssnr/nvngx_dlssnr.dll
          DLSSNR_ADAPTER_BUILT=false
          if [[ -f ./image_enhancement/nvidia_dlssnr_adapter/Release/foundation_dlssnr_adapter.dll ]]; then
            DLSSNR_ADAPTER_BUILT=true
            test -f ./inno_staging/tools/hdr_enhanced/nvidia_dlssnr/foundation_dlssnr_adapter.dll
            test -f ./inno_staging/tools/hdr_enhanced/nvidia_dlssnr/NVIDIA-DLSS-LICENSE.txt
            test -f ./inno_staging/tools/hdr_enhanced/nvidia_dlssnr/NVIDIA-OPTICAL-FLOW-NOTICES.txt
          fi
          test ! -e ./inno_staging/assets/hdr-components.json
          cmp ./ds5-sidecar-package.json ./inno_staging/tools/ds5-sidecar-package.json
          test -f ./inno_staging/assets/gui/sunshine-gui.exe
          cmp ../src_assets/common/sunshine-control-panel/src-tauri/target/x86_64-pc-windows-msvc/release/sunshine-gui.exe ./inno_staging/assets/gui/sunshine-gui.exe

          INNO_OUTPUT="$(cygpath -w "$(pwd)/inno_artifacts")"
          MSYS2_ARG_CONV_EXCL='/O' "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "/O${INNO_OUTPUT}" sunshine_installer.iss | tee inno-build.log
          grep -F "ds5-sidecar-package.json" inno-build.log
          if grep -Ei 'nvngx_(truehdr|dlssnr)\.dll' inno-build.log; then
            echo "NVIDIA enhancement runtimes must not be compiled into the installer"
            exit 1
          fi
          if [[ "$DLSSNR_ADAPTER_BUILT" == "true" ]]; then
            grep -F "foundation_dlssnr_adapter.dll" inno-build.log
            grep -F "NVIDIA-DLSS-LICENSE.txt" inno-build.log
            grep -F "NVIDIA-OPTICAL-FLOW-NOTICES.txt" inno-build.log
          fi
          if [[ "$RTX_VIDEO_ADAPTER_BUILT" == "true" ]]; then
            grep -F "foundation_rtx_video_adapter.dll" inno-build.log
          fi

          cpack -G ZIP -B ./portable_artifacts --config ./CPackConfig.cmake --verbose
          cmake -E tar tf ./portable_artifacts/Sunshine.zip | tr '\\' '/' > portable-files.txt
          grep -F "Sunshine/tools/ds5-sidecar-package.json" portable-files.txt
          if [[ "$RTX_VIDEO_ADAPTER_BUILT" == "true" ]]; then
            grep -F "Sunshine/tools/hdr_enhanced/nvidia_rtx_video/foundation_rtx_video_adapter.dll" portable-files.txt
          fi
          if [[ "$DLSSNR_ADAPTER_BUILT" == "true" ]]; then
            grep -F "Sunshine/tools/hdr_enhanced/nvidia_dlssnr/foundation_dlssnr_adapter.dll" portable-files.txt
            grep -F "Sunshine/tools/hdr_enhanced/nvidia_dlssnr/NVIDIA-DLSS-LICENSE.txt" portable-files.txt
            grep -F "Sunshine/tools/hdr_enhanced/nvidia_dlssnr/NVIDIA-OPTICAL-FLOW-NOTICES.txt" portable-files.txt
          fi
          if grep -Ei 'nvngx_(truehdr|dlssnr)\.dll|hdr-components\.json' portable-files.txt; then
            echo "Side-loaded HDR files and mutable trust metadata must not be included in the main portable package"
            exit 1
          fi
          grep -F "Sunshine/assets/gui/sunshine-gui.exe" portable-files.txt
          if grep -F "Sunshine/tools/sunshine-ds5-sidecar/Sunshine.Ds5Sidecar.exe" portable-files.txt; then
            echo "The optional DualSense runtime leaked into the main portable package"
            exit 1
          fi
          rm -rf portable-verify
          mkdir portable-verify
          cd portable-verify
          cmake -E tar xf ../portable_artifacts/Sunshine.zip
          cmp ../ds5-sidecar-package.json ./Sunshine/tools/ds5-sidecar-package.json
          cmp ../../src_assets/common/sunshine-control-panel/src-tauri/target/x86_64-pc-windows-msvc/release/sunshine-gui.exe ./Sunshine/assets/gui/sunshine-gui.exe
          cd ..

          mv ./inno_artifacts/Sunshine.exe ../artifacts/sunshine-windows-installer.exe
          mv ./portable_artifacts/Sunshine.zip ../artifacts/sunshine-windows-portable.zip

      - name: Fetch DualSense sidecar manual-download assets
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          # The pinned control panel downloads the optional DualSense runtime
          # from the upstream stable release (see the embedded manifest). Also
          # publish the exact same upstream artifacts here so users can grab
          # the extension package manually from this release page.
          $releaseTag = [System.IO.File]::ReadAllText(
            (Join-Path (Resolve-Path .) '.github/upstream-stable-release'),
            [System.Text.Encoding]::UTF8).Trim()
          $release = gh api "repos/AlkaidLab/foundation-sunshine/releases/tags/$releaseTag"
          $package = $release | ConvertFrom-Json
          $zipAsset = @($package.assets | Where-Object { $_.name -eq 'Sunshine.Ds5Sidecar.x64.zip' })[0]
          $manifestAsset = @($package.assets | Where-Object { $_.name -eq 'Sunshine.Ds5Sidecar.manifest.json' })[0]
          if (-not $zipAsset -or -not $manifestAsset) {
            throw 'Upstream stable release is missing the DualSense sidecar assets.'
          }
          Invoke-WebRequest -Uri $zipAsset.browser_download_url -OutFile .\artifacts\Sunshine.Ds5Sidecar.x64.zip -UseBasicParsing
          Invoke-WebRequest -Uri $manifestAsset.browser_download_url -OutFile .\artifacts\Sunshine.Ds5Sidecar.manifest.json -UseBasicParsing
          Get-FileHash .\artifacts\Sunshine.Ds5Sidecar.x64.zip -Algorithm SHA256 | Select-Object Hash

      - name: Rename release assets
        shell: msys2 {0}
        run: |
          # Format tag to vYEAR.DATE where DATE is zero-padded to 4 digits
          TAG="${{ needs.setup_release.outputs.release_tag }}"
          NEWTAG="$TAG"

          if [[ "$TAG" =~ ^v([0-9]{4})\.([0-9]+) ]]; then
            YEAR="${BASH_REMATCH[1]}"
            DATE_PART="${BASH_REMATCH[2]}"
            DATE_PADDED=$(printf "%04d" "$DATE_PART")
            NEWTAG="v${YEAR}.${DATE_PADDED}"
          fi

          # 重命名安装包和便携版
          INSTALLER_NAME="Sunshine.${NEWTAG}.WindowsInstaller.exe"
          mv artifacts/sunshine-windows-installer.exe "artifacts/${INSTALLER_NAME}"
          mv artifacts/sunshine-windows-portable.zip "artifacts/Sunshine.${NEWTAG}.Portable-x64.zip"

          # Legacy Control Panel builds treat any release asset containing
          # "Windows" as a full installer. Keep that marker exclusive to the
          # actual installer so existing users can update to the fixed build.
          for asset in artifacts/*; do
            name=$(basename "$asset")
            lower=${name,,}
            if [[ "$lower" == *windows* && "$lower" != "${INSTALLER_NAME,,}" ]]; then
              echo "Non-installer release asset would confuse legacy updaters: $name"
              exit 1
            fi
          done

      - name: Generate Checksums
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          # Generate SHA256 checksums after the assets have their final names.
          .\scripts\generate-checksums.ps1 -Path .\artifacts -Output "SHA256SUMS.txt"

      - name: Generate Release Notes
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.setup_release.outputs.release_tag }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $releaseCommit = (git rev-parse HEAD).Trim()
          .\scripts\generate-app-display-release-notes.ps1 `
            -ReleaseTag $env:RELEASE_TAG `
            -ReleaseCommit $releaseCommit `
            -ChecksumsPath .\artifacts\checksums.json `
            -OutputPath .\release-notes.md

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sunshine-windows-r${{ github.run_number }}
          path: |
            artifacts/Sunshine.*.WindowsInstaller.exe
            artifacts/Sunshine.*.Portable-x64.zip
            artifacts/Sunshine.Ds5Sidecar.x64.zip
            artifacts/Sunshine.Ds5Sidecar.manifest.json
            artifacts/SHA256SUMS.txt
            artifacts/checksums.json
          if-no-files-found: error

      - name: Create annotated release tag
        if: needs.setup_release.outputs.publish_release == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.setup_release.outputs.release_tag }}
          RELEASE_COMMIT: ${{ needs.setup_release.outputs.release_commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          git check-ref-format "refs/tags/$RELEASE_TAG"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$RELEASE_TAG" "$RELEASE_COMMIT" -m "Release $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Create GitHub Release
        if: needs.setup_release.outputs.publish_release == 'true'
        uses: ncipollo/release-action@v1.14.0
        with:
          allowUpdates: false
          artifactErrorsFailBuild: true
          artifacts: "artifacts/*"
          bodyFile: release-notes.md
          commit: ${{ needs.setup_release.outputs.release_commit }}
          generateReleaseNotes: true
          name: ${{ needs.setup_release.outputs.release_name }}
          prerelease: ${{ needs.setup_release.outputs.release_prerelease == 'true' }}
          tag: ${{ needs.setup_release.outputs.release_tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
