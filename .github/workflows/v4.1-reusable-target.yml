name: v4.1 reusable target

on:
  workflow_call:
    inputs:
      build-version:
        required: true
        type: string
      publish-release:
        required: true
        type: boolean
      release-tag:
        required: true
        type: string
      release-name:
        required: true
        type: string
      source-ref:
        required: true
        type: string
      prerelease:
        required: true
        type: boolean

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: echo "reusable target ${{ inputs.release-tag }}"
