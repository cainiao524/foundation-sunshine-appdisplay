name: Release v4.1 (one-time dispatch bridge)

on:
  push:
    branches:
      - release/v4.1

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/main.yml
    with:
      build-version: v4.1
      publish-release: true
      release-tag: v4.1
      release-name: Sunshine App Display Profile v4.1
      source-ref: 4f0f2908d407b153a69ab9f130f6ce0e4d5fb70a
      prerelease: false
    secrets: inherit
